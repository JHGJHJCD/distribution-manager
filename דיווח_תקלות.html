<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כלי דיווח תקלות ובקשות שיפור — מנהל חלוקה</title>
<style>
/* ============================================================================
   כלי דיווח תקלות ובקשות שיפור — מנהל חלוקה
   קובץ יחיד (HTML + CSS + JS), ללא שרת וללא התקנות. שמירה אוטומטית ב-LocalStorage.
   העיצוב תואם את התוכנה: "ירוק רגוע" — ירוק #0f9d78/#0f766e, כתום #f59e0b לפעולה
   משנית, כרטיסים לבנים על רקע ירקרק בהיר.
   ---------------------------------------------------------------------------
   מבנה הנתונים:
     APP_STRUCTURE = [{ key, name, icon, items:[{key,name,type,desc}] }]
     state.bugs    = { "<tabKey>::<itemKey>": [ {id, kind, severity, status,
                        desc, steps, actual, expected, notes, shots:[{name,data}]} ] }
     kind = "bug" (תקלה) | "improvement" (בקשת שיפור)
   כדי להרחיב — הוסף לשונית/פריט ל-APP_STRUCTURE; שאר הכלי מתעדכן אוטומטית.
============================================================================ */
:root{
  --bg:#f4faf7; --card:#ffffff; --line:#dcece5; --ink:#0f2e28; --muted:#5d7d74;
  --blue:#0f766e; --blue2:#0f9d78; --blue-soft:#e6f6f0;
  --green:#059669; --amber:#b45309; --red:#dc2626; --purple:#6d28d9;
  --teal:#0891b2; --teal-soft:#ecfeff; --orange:#f59e0b;
  --radius:12px; --shadow:0 1px 3px rgba(15,80,60,.06),0 4px 16px rgba(15,80,60,.05);
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg);
  color:var(--ink); direction:rtl; font-size:14px; line-height:1.5;
}
button{font-family:inherit; cursor:pointer;}
textarea,input,select{font-family:inherit;}

/* ── Top app-bar (mirrors the program) ─────────────────────────────────── */
.appbar{
  background:linear-gradient(180deg,#12b088,#0f766e); color:#fff;
  padding:14px 22px; display:flex; align-items:center; gap:16px;
  box-shadow:0 2px 10px rgba(15,80,60,.25); position:sticky; top:0; z-index:50;
}
.appbar .logo{
  width:46px;height:46px;border-radius:10px;background:#fff;color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;
}
.appbar h1{font-size:20px;margin:0;font-weight:800;}
.appbar .sub{font-size:12.5px;opacity:.9;}
.appbar .spacer{flex:1;}

/* ── Statistics strip ──────────────────────────────────────────────────── */
.stats{display:flex;gap:10px;flex-wrap:wrap;padding:14px 22px 4px;}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:8px 16px;min-width:92px;text-align:center;box-shadow:var(--shadow);
}
.stat b{display:block;font-size:22px;font-weight:900;line-height:1.1;}
.stat span{font-size:12px;color:var(--muted);}
.stat.total b{color:var(--blue);}
.stat.bugs  b{color:var(--red);}
.stat.imp   b{color:var(--teal);}
.stat.open  b{color:var(--amber);}
.stat.done  b{color:var(--green);}
.stat.crit  b{color:var(--red);}

/* ── Toolbar ───────────────────────────────────────────────────────────── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 22px 14px;}
.toolbar input[type=search],.toolbar select{
  border:1px solid #cfe2da;border-radius:10px;padding:9px 12px;background:#fff;font-size:14px;
}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:400px;}
.btn{
  border:none;border-radius:10px;padding:9px 18px;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(180deg,var(--blue2),var(--blue));box-shadow:var(--shadow);
}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:#fff;color:#1f2937;border:1px solid #cfe2da;}
.btn.teal{background:linear-gradient(180deg,#fbbf24,#f59e0b);}
.btn.small{padding:5px 12px;font-size:12.5px;border-radius:8px;}
.btn.danger{background:linear-gradient(180deg,#f87171,#dc2626);}

/* ── Layout: sidebar (tabs) + content ──────────────────────────────────── */
.layout{display:flex;gap:16px;padding:0 22px 40px;align-items:flex-start;}
.sidebar{
  width:230px;flex:none;position:sticky;top:96px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.sidebar h3{margin:0;padding:12px 16px;font-size:13px;color:var(--muted);
  border-bottom:1px solid var(--line);background:#f2f9f5;font-weight:800;}
.tab-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:none;padding:12px 16px;font-size:15px;font-weight:700;color:var(--ink);
  border-bottom:1px solid #eef6f2;
}
.tab-btn .ic{font-size:18px;}
.tab-btn .cnt{margin-inline-start:auto;background:var(--blue-soft);color:var(--blue);
  border-radius:20px;padding:1px 9px;font-size:12px;font-weight:800;min-width:22px;text-align:center;}
.tab-btn:hover{background:#f2f9f5;}
.tab-btn.active{background:var(--blue-soft);color:var(--blue);box-shadow:inset 3px 0 0 var(--blue);}

.content{flex:1;min-width:0;}
.content-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px;}
.content-head h2{margin:0;font-size:22px;font-weight:800;}
.content-head .desc{color:var(--muted);font-size:13px;}

/* ── Item cards ────────────────────────────────────────────────────────── */
.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.item-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f2f9f5;
  border-bottom:1px solid var(--line);flex-wrap:wrap;}
.item-head .name{font-weight:800;font-size:15.5px;}
.type-badge{font-size:11.5px;font-weight:800;border-radius:20px;padding:2px 10px;color:#fff;}
.type-field{background:#0891b2;} .type-button{background:var(--blue);}
.type-action{background:var(--purple);} .type-table{background:#475569;}
.item-head .idesc{color:var(--muted);font-size:12.5px;}
.item-head .grow{flex:1;}
.no-bugs{color:#94a3b8;font-size:13px;padding:2px 2px 10px;}

/* ── Report cards ──────────────────────────────────────────────────────── */
.bug{border:1px solid #e2ede9;border-radius:10px;padding:12px;margin-bottom:12px;background:#fcfefd;}
.bug.sev-critical{border-inline-start:5px solid var(--red);}
.bug.sev-high{border-inline-start:5px solid #ea580c;}
.bug.sev-medium{border-inline-start:5px solid var(--amber);}
.bug.sev-low{border-inline-start:5px solid #16a34a;}
.bug.kind-improvement{background:var(--teal-soft);border-inline-start:5px solid var(--teal);}
.bug-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.bug-top select{border:1px solid #cfe2da;border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:700;background:#fff;}
.bug-top select.sel-kind[data-k="improvement"]{color:var(--teal);border-color:#a5e8f2;background:#f4feff;}
.bug-top select.sel-kind[data-k="bug"]{color:var(--red);}
.bug-top .bug-id{color:#94a3b8;font-size:12px;margin-inline-start:auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fieldbox label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px;}
.fieldbox textarea{
  width:100%;border:1px solid #cfe2da;border-radius:8px;padding:8px;font-size:13.5px;resize:vertical;
  min-height:46px;background:#fff;
}
.fieldbox textarea.desc{min-height:60px;}
.fieldbox{margin-bottom:9px;}
.dropzone{
  border:2px dashed #bcd8cd;border-radius:8px;padding:10px;text-align:center;color:#94a3b8;
  font-size:12.5px;background:#f6fbf9;cursor:pointer;transition:.15s;
}
.dropzone.over{border-color:var(--blue2);background:var(--blue-soft);color:var(--blue);}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.shot{position:relative;}
.shot img{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer;}
.shot .del{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--red);color:#fff;border:none;
  border-radius:50%;width:20px;height:20px;font-weight:900;font-size:12px;line-height:1;}
.bug-actions{display:flex;gap:8px;margin-top:8px;}

/* status colour tags in selects */
.sel-status[data-v="fixed"],.sel-status[data-v="verified"]{color:var(--green);}
.sel-status[data-v="in-progress"]{color:var(--purple);}
.sel-status[data-v="new"]{color:var(--amber);}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(15,46,40,.85);display:none;align-items:center;
  justify-content:center;z-index:100;padding:30px;}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}

.empty-note{color:#94a3b8;text-align:center;padding:40px;font-size:15px;}
@media(max-width:820px){
  .layout{flex-direction:column;} .sidebar{width:100%;position:static;}
  .grid2{grid-template-columns:1fr;}
}
.toast{position:fixed;inset-inline-end:20px;bottom:20px;background:#0f2e28;color:#fff;padding:10px 18px;
  border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);
  transition:.2s;z-index:120;font-weight:700;}
.toast.show{opacity:1;transform:none;}
</style>
</head>
<body>

<div class="appbar">
  <div class="logo">🐞</div>
  <div>
    <h1>כלי דיווח תקלות ובקשות שיפור</h1>
    <div class="sub">מנהל חלוקה · גרסה 2.93 · קופה של צדקה הר יונה · נוף הגליל</div>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" onclick="exportReport()">⬇ ייצוא דוח</button>
  <button class="btn" onclick="copyReport()">📋 העתק ללוח</button>
</div>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="search" id="search" placeholder="🔎 חיפוש: תיאור, שלבים, פריט..." oninput="render()">
  <select id="fKind" onchange="render()">
    <option value="">🐞💡 תקלות ושיפורים</option>
    <option value="bug">🐞 תקלות בלבד</option>
    <option value="improvement">💡 שיפורים בלבד</option>
  </select>
  <select id="fSeverity" onchange="render()">
    <option value="">כל הרמות</option>
    <option value="critical">קריטי / דחוף</option>
    <option value="high">גבוה</option>
    <option value="medium">בינוני</option>
    <option value="low">נמוך</option>
  </select>
  <select id="fStatus" onchange="render()">
    <option value="">כל הסטטוסים</option>
    <option value="new">חדש</option>
    <option value="in-progress">בטיפול</option>
    <option value="fixed">טופל / בוצע</option>
    <option value="verified">נבדק / אושר</option>
  </select>
  <button class="btn ghost small" onclick="clearAll()">🗑 נקה הכל</button>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <h3>לשוניות התוכנה</h3>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lbImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= מבנה התוכנה (לשוניות ופריטים) =======================
   מעודכן לגרסה 2.93 — 5 אזורים בתוכנה (חלוקה · אנשים · הודעות · צינתוקים · הגדרות). כולל:
   ברירת מחדל "כל המקבלים" (קבועים + חד-פעמיים יחד לפי ניקוד),
   שני שלבים (הכנה → רישום מי קיבל / מי לא הגיע), התראות אי-הגעה,
   בחירת חד-פעמיים בחלון, מצב "סינון מותאם" + איזון בין קהילות,
   שמור PDF, סנכרון בין 2 מחשבים, צ'אט צוות ("הודעות"), בקרת מנהל,
   גודל טקסט באחוזים (מיידי), סטטוס סנכרון ויזואלי, הודעות למפתח בתוך התוכנה,
   וצינתוקים — הודעה קולית לזכאי החלוקה דרך ימות המשיח (2.82; מ-2.85 אישור הגעה בהקשה על 7; מ-2.86 יצירת הקלטה מטקסט בקול AI + מאגר הקלטות).
   * לשונית "חד פעמי" הנפרדת הוסרה — הבחירה נעשית מתוך מסך החלוקה. */
const APP_STRUCTURE = [
  { key:"dist", name:"חלוקה ורישום", icon:"📋", items:[
    {key:"name",     name:"שדה: שם החלוקה", type:"field",  desc:"בשבועי רגיל אפשר להשאיר ריק — מ-2.93 נכתב אוטומטית עם הפרשה והתאריך העברי, למשל 'חלוקת פרשת נצבים — כ׳ אלול תשפ״ו'; חובה במצב מיוחד"},
    {key:"date",     name:"שדה: תאריך",     type:"field",  desc:"לוח שנה, ימי רביעי מסומנים"},
    {key:"distr",    name:"שדה: מחלק",      type:"field",  desc:"שם מבצע החלוקה; נזכר אוטומטית"},
    {key:"prod",     name:"שדה: מוצרים זמינים", type:"field", desc:"מספר המנות; קובע כמה נשאר לחד-פעמיים"},
    {key:"reserve",  name:"שדה: רזרבה",     type:"field",  desc:"כמה אנשי רזרבה לצרף (רשימת המתנה)"},
    {key:"note",     name:"שדה: הערה כללית לחלוקה", type:"field", desc:"נשמרת פעם אחת ברמת החלוקה"},
    {key:"leftover", name:"חיווי: נשאר לחד-פעמיים", type:"action", desc:"מציג כמה מנות נותרו ואם נבחרו חד-פעמיים"},
    {key:"pickone",  name:"כפתור: בחר חד-פעמיים", type:"button", desc:"פותח חלון בחירה — מומלצים מסומנים מראש; מוסיף אותם לחלוקה"},
    {key:"manualadd",name:"כפתור: ＋ הוסף מקבל (ידני)", type:"button", desc:"הוספת כל מקבל פעיל לחלוקה — גם אם אינו בתור השבוע"},
    {key:"qsearch",  name:"שדה: חיפוש מהיר ברשימה", type:"field", desc:"סינון רשימת השבוע לפי כל פרט"},
    {key:"stage",    name:"שני שלבים: הכנה ← רישום", type:"action", desc:"כפתור כתום 'רישום מי קיבל' עובר לשלב סימון; מי שלא סומן נרשם כ'לא הגיע'"},
    {key:"table",    name:"טבלת המקבלים", type:"table", desc:"בשלב רישום מסמנים מי הגיע; עמודות שם/עדיפות/ניקוד/ילדים/הערה + תג 'לא הגיע'"},
    {key:"adv",      name:"אזור מתקפל: מצבי חלוקה מתקדמים", type:"action", desc:"בורר מצב (רגיל=לפי לוח / בלי קבועים / לפי ניקוד / סינון מותאם) + הגדר סינון; מ-2.93 במצב ניקוד המובילים בצורך מסומנים ⭐ אוטומטית לפי מספר המוצרים ומתעדכנים חי"},
    {key:"balance",  name:"איזון בין קהילות", type:"action", desc:"במצב 'סינון מותאם' — מכסה יחסית לכל קהילה (נציג/בית כנסת); ניתן לכבות"},
    {key:"volmail",  name:"אזור מתקפל: שליחה למתנדב במייל", type:"action", desc:"מייל המתנדב · שלח רשימה · ייבוא הקובץ שהוחזר"},
    {key:"register", name:"כפתור: רישום מי קיבל / שמירה", type:"button", desc:"רושם להיסטוריה (הגיע/לא הגיע) + מייצא אקסל"},
    {key:"print",    name:"כפתור: הדפסה לחלוקה", type:"button", desc:"מדפיס את רשימת החלוקה + רזרבה (A4)"},
    {key:"pdf",      name:"כפתור: שמור PDF", type:"button", desc:"שומר את הרשימה כ-PDF בתיקיית ההורדות ופותח אותה"},
    {key:"reset",    name:"כפתור: חלוקה חדשה (איפוס מסך)", type:"button", desc:"מנקה מוצרים/רזרבה/שם/הערה/סימונים/בחירות; רישומים שמורים לא נפגעים; מ-2.93 כפתור צהוב בוהק עם סמל איתחול ⟳"},
  ]},
  { key:"recipients", name:"מקבלים (אזור 'אנשים')", icon:"👥", items:[
    {key:"search", name:"שדה חיפוש", type:"field", desc:"שם, טלפון, ת״ז, כתובת"},
    {key:"filter", name:"סינון סטטוס / עדיפות", type:"action", desc:"פעיל/מושהה, לפי דרגה"},
    {key:"add",    name:"כפתור: + הוסף מקבל", type:"button", desc:"טופס הוספת משפחה/מקבל (תדירות מוצגת רק ל'קבוע')"},
    {key:"import", name:"כפתור: יבוא מ-Excel", type:"button", desc:"ייבוא רשימה שלמה מאקסל"},
    {key:"dups",   name:"כפתור: בדיקת כפילויות", type:"button", desc:"מאתר רשומות כפולות"},
    {key:"alert",  name:"תג 'לא הגיע' / התראת אי-הגעה", type:"action", desc:"מוצג ברשימה ובכרטיס למי שלא הגיע כמה חלוקות ברצף"},
    {key:"rowbtns",name:"כפתורים: הפעל / השהה / מחק", type:"button", desc:"פעולות על השורה"},
    {key:"table",  name:"טבלת המקבלים (לחיצה כפולה=עריכה)", type:"table", desc:"עריכת פרטי מקבל (כולל נציג/קהילה)"},
  ]},
  { key:"search", name:"חיפוש מהיר (אזור 'אנשים')", icon:"🔍", items:[
    {key:"input",  name:"שדה חיפוש", type:"field", desc:"חיפוש מקבל בכל השדות"},
    {key:"results",name:"רשימת תוצאות", type:"table", desc:"בחירה מציגה פרופיל"},
    {key:"profile",name:"כרטיס פרופיל + היסטוריה", type:"action", desc:"פרטי המקבל וחלוקותיו (אפשר למחוק רישום בודד)"},
    {key:"export", name:"כפתור: ייצוא הרשימה", type:"button", desc:"מוריד תוצאות לאקסל"},
    {key:"printcard",name:"כפתור: הדפסת כרטיס מקבל", type:"button", desc:"מדפיס כרטיס פרטים (גופן גדול)"},
  ]},
  { key:"distributions", name:"חלוקות קודמות (אזור 'אנשים')", icon:"📦", items:[
    {key:"table",  name:"טבלת החלוקות (לחיצה כפולה=פרטים)", type:"table", desc:"שורה לכל אירוע חלוקה; קליק ימני על חלוקה — הדפסה / שמירת PDF / ייצוא לאקסל / שליחת צינתוק לרשימה (תוקן ב-2.93)"},
    {key:"delete", name:"כפתור: מחק חלוקה", type:"button", desc:"מוחק אצווה ורישומיה (מגלגל תאריכים)"},
  ]},
  { key:"messages", name:"הודעות (צ'אט צוות)", icon:"💬", items:[
    {key:"chat",   name:"שיחת הצוות", type:"action", desc:"הודעות מסונכרנות בין המחשבים · ✓✓ נקרא · שעון ישראל"},

  ]},
  { key:"general", name:"כללי ורעיונות", icon:"💡", items:[
    {key:"idea",   name:"רעיון / בקשת שיפור כללית", type:"action", desc:"שיפור שאינו קשור לפריט מסוים בתוכנה"},
    {key:"other",  name:"תקלה כללית / משהו אחר", type:"action", desc:"כל דבר שלא מצאת לו מקום בלשוניות"},

];

const KINDS = {
  bug:         {label:"תקלה", icon:"🐞"},
  improvement: {label:"שיפור", icon:"💡"},
};
const SEVERITIES = {critical:"קריטי", high:"גבוה", medium:"בינוני", low:"נמוך"};
/* status + field wording differ a touch between a bug report and an idea */
const STATUS_TEXT = {
  bug:         {new:"חדש", "in-progress":"בטיפול", fixed:"תוקן",  verified:"נבדק"},
  improvement: {new:"חדש", "in-progress":"בעבודה", fixed:"בוצע",  verified:"אושר"},
};
const SEV_TITLE  = {bug:"חומרה", improvement:"עדיפות"};
const FIELD_LABELS = {
  bug: {
    desc:"תיאור התקלה", steps:"שלבים לשחזור",
    actual:"תוצאה בפועל", expected:"תוצאה צפויה", notes:"הערות",
    descPh:"מה לא עובד?", stepsPh:"1. ...\n2. ...",
    actualPh:"מה קרה", expectedPh:"מה היה אמור לקרות",
  },
  improvement: {
    desc:"מה לשפר / הבקשה", steps:"למה זה חשוב",
    actual:"איך זה עובד היום", expected:"איך היית רוצה שיעבוד", notes:"הערות",
    descPh:"מה תרצה שנוסיף או נשנה?", stepsPh:"מתי זה מפריע / מה זה יחסוך",
    actualPh:"המצב הנוכחי (לא חובה)", expectedPh:"ההתנהגות הרצויה",
  },
};

function kindOf(b){ return b.kind === "improvement" ? "improvement" : "bug"; }
function statusText(kind,key){ return (STATUS_TEXT[kind]||STATUS_TEXT.bug)[key] || key; }

/* ============================== מצב + אחסון ============================== */
const LS_KEY = "manhal_bug_reports_v1";
let state = { bugs:{}, activeTab: APP_STRUCTURE[0].key };
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const p = JSON.parse(raw); state.bugs = p.bugs||{}; state.activeTab = p.activeTab||state.activeTab; }
  }catch(e){ console.warn("load failed", e); }
  // migrate old records that predate the bug/improvement split
  for(const k in state.bugs) for(const b of state.bugs[k]) if(!b.kind) b.kind = "bug";
  // if the saved active tab no longer exists (e.g. removed "חד פעמי"), fall back
  if(!APP_STRUCTURE.some(t=>t.key===state.activeTab)) state.activeTab = APP_STRUCTURE[0].key;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch(e){ toast("⚠ שמירה נכשלה (אולי אין מקום ל-LocalStorage)"); }
  }, 250);
}
function itemKey(tab,item){ return tab+"::"+item; }
function bugsFor(tab,item){ return state.bugs[itemKey(tab,item)] || []; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================== פעולות דיווח ============================== */
function newReport(tab,item,kind){
  kind = kind==="improvement" ? "improvement" : "bug";
  const k = itemKey(tab,item);
  (state.bugs[k] = state.bugs[k]||[]).push({
    id:uid(), kind, severity:"medium", status:"new",
    desc:"", steps:"", actual:"", expected:"", notes:"", shots:[]
  });
  save(); render();
}
function delBug(tab,item,id){
  const k = itemKey(tab,item);
  if(!confirm("למחוק את הדיווח?")) return;
  state.bugs[k] = (state.bugs[k]||[]).filter(b=>b.id!==id);
  if(!state.bugs[k].length) delete state.bugs[k];
  save(); render();
}
function dupBug(tab,item,id){
  const k = itemKey(tab,item);
  const src = (state.bugs[k]||[]).find(b=>b.id===id);
  if(!src) return;
  const copy = JSON.parse(JSON.stringify(src)); copy.id = uid();
  const idx = state.bugs[k].findIndex(b=>b.id===id);
  state.bugs[k].splice(idx+1,0,copy);
  save(); render();
}
function updBug(tab,item,id,field,val){
  const b = (state.bugs[itemKey(tab,item)]||[]).find(x=>x.id===id);
  if(b){ b[field]=val; save(); if(field==="severity"||field==="status"||field==="kind") render(); else updateStats(); }
}

/* ============================== צילומי מסך ============================== */
function addShots(tab,item,id,files){
  const b = (state.bugs[itemKey(tab,item)]||[]).find(x=>x.id===id);
  if(!b) return;
  let pending = 0;
  [...files].forEach(f=>{
    if(!f.type.startsWith("image/")) return;
    pending++;
    const r = new FileReader();
    r.onload = e=>{ b.shots.push({name:f.name, data:e.target.result}); if(--pending===0){ save(); render(); } };
    r.readAsDataURL(f);
  });
}
function delShot(tab,item,id,idx){
  const b = (state.bugs[itemKey(tab,item)]||[]).find(x=>x.id===id);
  if(b){ b.shots.splice(idx,1); save(); render(); }
}
function lightbox(src){ const lb=document.getElementById("lightbox"); document.getElementById("lbImg").src=src; lb.classList.add("show"); }

/* ============================== סינון ============================== */
function activeFilters(){
  return {
    q: document.getElementById("search").value.trim().toLowerCase(),
    kind: document.getElementById("fKind").value,
    sev: document.getElementById("fSeverity").value,
    st: document.getElementById("fStatus").value,
  };
}
function bugMatches(b,item,f){
  if(f.kind && kindOf(b)!==f.kind) return false;
  if(f.sev && b.severity!==f.sev) return false;
  if(f.st && b.status!==f.st) return false;
  if(f.q){
    const hay = [b.desc,b.steps,b.actual,b.expected,b.notes,item.name].join(" ").toLowerCase();
    if(!hay.includes(f.q)) return false;
  }
  return true;
}
function filtering(f){ return !!(f.q||f.kind||f.sev||f.st); }

/* ============================== רינדור ============================== */
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function countAll(){
  let c={total:0,bug:0,improvement:0,new:0,"in-progress":0,fixed:0,verified:0,critical:0};
  for(const k in state.bugs) for(const b of state.bugs[k]){
    c.total++; c[kindOf(b)]++; c[b.status]=(c[b.status]||0)+1;
    if(kindOf(b)==="bug" && b.severity==="critical") c.critical++;
  }
  return c;
}
function updateStats(){
  const c = countAll();
  document.getElementById("stats").innerHTML = `
    <div class="stat total"><b>${c.total}</b><span>סה״כ דיווחים</span></div>
    <div class="stat bugs"><b>${c.bug}</b><span>🐞 תקלות</span></div>
    <div class="stat imp"><b>${c.improvement}</b><span>💡 שיפורים</span></div>
    <div class="stat open"><b>${(c.new||0)+(c["in-progress"]||0)}</b><span>פתוחים</span></div>
    <div class="stat done"><b>${(c.fixed||0)+(c.verified||0)}</b><span>טופלו</span></div>
    <div class="stat crit"><b>${c.critical||0}</b><span>תקלות קריטיות</span></div>`;
}

function renderSidebar(){
  const f = activeFilters();
  let html = "<h3>לשוניות התוכנה</h3>";
  APP_STRUCTURE.forEach(tab=>{
    let cnt=0; tab.items.forEach(it=>{ cnt += bugsFor(tab.key,it.key).filter(b=>bugMatches(b,it,f)).length; });
    html += `<button class="tab-btn ${tab.key===state.activeTab?'active':''}" onclick="selectTab('${tab.key}')">
      <span class="ic">${tab.icon}</span><span>${tab.name}</span>
      ${cnt?`<span class="cnt">${cnt}</span>`:""}</button>`;
  });
  document.getElementById("sidebar").innerHTML = html;
}

function bugCard(tab,item,b){
  const kind = kindOf(b);
  const L = FIELD_LABELS[kind];
  const shots = b.shots.map((s,i)=>`
    <div class="shot"><img src="${s.data}" title="${esc(s.name)}" onclick="lightbox('${s.data}')">
      <button class="del" title="מחק תמונה" onclick="delShot('${tab}','${item.key}','${b.id}',${i})">×</button></div>`).join("");
  const kindOpts = Object.entries(KINDS).map(([v,o])=>`<option value="${v}" ${kind===v?"selected":""}>${o.icon} ${o.label}</option>`).join("");
  const sevOpts  = Object.entries(SEVERITIES).map(([v,t])=>`<option value="${v}" ${b.severity===v?"selected":""}>${t}</option>`).join("");
  const stOpts   = Object.keys(STATUS_TEXT[kind]).map(v=>`<option value="${v}" ${b.status===v?"selected":""}>${statusText(kind,v)}</option>`).join("");
  const U = `'${tab}','${item.key}','${b.id}'`;
  return `<div class="bug kind-${kind} sev-${b.severity}">
    <div class="bug-top">
      <select class="sel-kind" data-k="${kind}" title="סוג הדיווח" onchange="updBug(${U},'kind',this.value)">${kindOpts}</select>
      <select title="${SEV_TITLE[kind]}" onchange="updBug(${U},'severity',this.value)">${sevOpts}</select>
      <select class="sel-status" data-v="${b.status}" title="סטטוס" onchange="updBug(${U},'status',this.value)">${stOpts}</select>
      <span class="bug-id">#${b.id.slice(-5)}</span>
    </div>
    <div class="fieldbox"><label>${L.desc}</label>
      <textarea class="desc" oninput="updBug(${U},'desc',this.value)" placeholder="${L.descPh}">${esc(b.desc)}</textarea></div>
    <div class="fieldbox"><label>${L.steps}</label>
      <textarea oninput="updBug(${U},'steps',this.value)" placeholder="${esc(L.stepsPh)}">${esc(b.steps)}</textarea></div>
    <div class="grid2">
      <div class="fieldbox"><label>${L.actual}</label>
        <textarea oninput="updBug(${U},'actual',this.value)" placeholder="${L.actualPh}">${esc(b.actual)}</textarea></div>
      <div class="fieldbox"><label>${L.expected}</label>
        <textarea oninput="updBug(${U},'expected',this.value)" placeholder="${L.expectedPh}">${esc(b.expected)}</textarea></div>
    </div>
    <div class="fieldbox"><label>${L.notes}</label>
      <textarea oninput="updBug(${U},'notes',this.value)">${esc(b.notes)}</textarea></div>
    <div class="dropzone" ondragover="event.preventDefault();this.classList.add('over')"
         ondragleave="this.classList.remove('over')"
         ondrop="event.preventDefault();this.classList.remove('over');addShots(${U},event.dataTransfer.files)"
         onclick="this.querySelector('input').click()">
      📎 גרור לכאן תמונות מסך, או לחץ לבחירה
      <input type="file" accept="image/*" multiple hidden onchange="addShots(${U},this.files)">
    </div>
    ${shots?`<div class="shots">${shots}</div>`:""}
    <div class="bug-actions">
      <button class="btn ghost small" onclick="dupBug(${U})">⧉ שכפל</button>
      <button class="btn danger small" onclick="delBug(${U})">🗑 מחק</button>
    </div>
  </div>`;
}

function renderContent(){
  const tab = APP_STRUCTURE.find(t=>t.key===state.activeTab);
  const f = activeFilters();
  const filt = filtering(f);
  let html = `<div class="content-head"><h2>${tab.icon} ${tab.name}</h2>
     <span class="desc">${filt?"מוצגים דיווחים מסוננים בלבד":"לחץ על פריט כדי לדווח תקלה 🐞 או לבקש שיפור 💡"}</span></div>`;
  let shownItems = 0;
  tab.items.forEach(item=>{
    let bugs = bugsFor(tab.key,item.key);
    if(filt){ bugs = bugs.filter(b=>bugMatches(b,item,f)); if(!bugs.length) return; }
    shownItems++;
    html += `<div class="item">
      <div class="item-head">
        <span class="type-badge type-${item.type}">${({field:"שדה",button:"כפתור",action:"פעולה",table:"טבלה"})[item.type]}</span>
        <span class="name">${item.name}</span>
        <span class="grow"></span>
        <span class="idesc">${esc(item.desc||"")}</span>
        <button class="btn small" onclick="newReport('${tab.key}','${item.key}','bug')">＋ תקלה</button>
        <button class="btn teal small" onclick="newReport('${tab.key}','${item.key}','improvement')">＋ שיפור</button>
      </div>
      <div class="item-body">
        ${bugs.length? bugs.map(b=>bugCard(tab.key,item,b)).join("")
                     : '<div class="no-bugs">אין דיווחים לפריט זה. הוסף תקלה או בקשת שיפור בכפתורים למעלה.</div>'}
      </div></div>`;
  });
  if(filt && !shownItems) html += `<div class="empty-note">אין דיווחים שתואמים את הסינון בלשונית זו.</div>`;
  document.getElementById("content").innerHTML = html;
}

function render(){ updateStats(); renderSidebar(); renderContent(); }
function selectTab(k){ state.activeTab=k; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ============================== ייצוא / העתקה ============================== */
function buildReport(){
  const c = countAll();
  let md = `# דוח תקלות ובקשות שיפור — מנהל חלוקה (גרסה 2.93)\n\n`;
  md += `נוצר: ${new Date().toLocaleString("he-IL")}\n\n`;
  md += `**סיכום:** סה״כ ${c.total} · 🐞 תקלות ${c.bug} · 💡 שיפורים ${c.improvement} · `;
  md += `פתוחים ${(c.new||0)+(c["in-progress"]||0)} · טופלו ${(c.fixed||0)+(c.verified||0)} · תקלות קריטיות ${c.critical||0}\n`;
  let any=false;
  APP_STRUCTURE.forEach(tab=>{
    const itemsWithBugs = tab.items.filter(it=>bugsFor(tab.key,it.key).length);
    if(!itemsWithBugs.length) return;
    md += `\n## לשונית: ${tab.name}\n`;
    itemsWithBugs.forEach(it=>{
      md += `\n### ${it.name}\n`;
      bugsFor(tab.key,it.key).forEach((b,i)=>{
        any=true;
        const kind = kindOf(b);
        const K = KINDS[kind];
        md += `\n**${K.icon} ${K.label} ${i+1}** (#${b.id.slice(-5)}) — ${SEV_TITLE[kind]}: ${SEVERITIES[b.severity]} · סטטוס: ${statusText(kind,b.status)}\n`;
        const L = FIELD_LABELS[kind];
        if(b.desc)     md += `- ${L.desc}: ${b.desc.replace(/\n/g," ")}\n`;
        if(b.steps)    md += `- ${L.steps}: ${b.steps.replace(/\n/g," / ")}\n`;
        if(b.actual)   md += `- ${L.actual}: ${b.actual.replace(/\n/g," ")}\n`;
        if(b.expected) md += `- ${L.expected}: ${b.expected.replace(/\n/g," ")}\n`;
        if(b.notes)    md += `- ${L.notes}: ${b.notes.replace(/\n/g," ")}\n`;
        if(b.shots.length) md += `- צורפו ${b.shots.length} תמונות מסך: ${b.shots.map(s=>s.name).join(", ")}\n`;
      });
    });
  });
  if(!any) md += `\n_לא נרשמו דיווחים._\n`;
  return md;
}
function download(name,text){
  const blob = new Blob([text],{type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportReport(){
  const d = new Date(), pad=n=>String(n).padStart(2,"0");
  download(`דוח_תקלות_ושיפורים_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.md`, buildReport());
  toast("📄 הדוח יוצא");
}
async function copyReport(){
  const txt = buildReport();
  try{ await navigator.clipboard.writeText(txt); toast("📋 הדוח הועתק ללוח"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy"); toast("📋 הדוח הועתק ללוח");}catch(_){toast("⚠ ההעתקה נכשלה");}
    ta.remove();
  }
}
function clearAll(){
  if(!confirm("לנקות את כל הדיווחים שנרשמו? פעולה זו אינה הפיכה.")) return;
  state.bugs={}; save(); render(); toast("נוקו כל הדיווחים");
}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ============================== אתחול ============================== */
load(); render();
</script>
