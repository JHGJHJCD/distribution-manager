<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>כלי דיווח תקלות ובקשות שיפור — מנהל חלוקה</title>
<style>
/* ============================================================================
   כלי דיווח תקלות ובקשות שיפור — מנהל חלוקה
   קובץ יחיד (HTML + CSS + JS), ללא שרת וללא התקנות. שמירה אוטומטית ב-LocalStorage.
   העיצוב תואם את התוכנה: "ירוק רגוע" — ירוק #0f9d78/#0f766e, כתום #f59e0b לפעולה
   משנית, כרטיסים לבנים על רקע ירקרק בהיר.
   ---------------------------------------------------------------------------
   יכולות עיקריות:
     · דיווח תקלה 🐞 / בקשת שיפור 💡 לכל פריט בתוכנה, עם חומרה/סטטוס/שדות מובנים
     · צילומי מסך: גרירה, בחירה, או הדבקה ישירה (Ctrl+V) לתוך דיווח;
       תמונות גדולות מוקטנות אוטומטית כדי לא למלא את האחסון המקומי
     · חותמת זמן וגרסה לכל דיווח, שם מדווח, כיווץ/הרחבת דיווחים
     · מחיקה עם "בטל" (Undo), סטטיסטיקות לחיצות (מסננות), חיפוש וסינון
     · ⬇ דוח HTML מלא עם התמונות (לשליחה למפתח) + העתקת דוח טקסט ללוח
     · 💾 גיבוי JSON + 📂 ייבוא/מיזוג — להעברת הדיווחים בין מחשבים
   ---------------------------------------------------------------------------
   מבנה הנתונים:
     APP_STRUCTURE = [{ key, name, icon, items:[{key,name,type,desc}] }]
     state.bugs    = { "<tabKey>::<itemKey>": [ {id, kind, severity, status,
                        desc, steps, actual, expected, notes, shots:[{name,data}],
                        created, updated, ver, collapsed} ] }
     kind = "bug" (תקלה) | "improvement" (בקשת שיפור)
   כדי להרחיב — הוסף לשונית/פריט ל-APP_STRUCTURE; שאר הכלי מתעדכן אוטומטית.
   עדכון גרסה: לשנות את APP_VERSION (מוזרק לכותרת ולדוחות) + את APP_STRUCTURE.
============================================================================ */
:root{
  --bg:#f4faf7; --card:#ffffff; --line:#dcece5; --ink:#0f2e28; --muted:#5d7d74;
  --blue:#0f766e; --blue2:#0f9d78; --blue-soft:#e6f6f0;
  --green:#059669; --amber:#b45309; --red:#dc2626; --purple:#6d28d9;
  --teal:#0891b2; --teal-soft:#ecfeff; --orange:#f59e0b;
  --radius:12px; --shadow:0 1px 3px rgba(15,80,60,.06),0 4px 16px rgba(15,80,60,.05);
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg);
  color:var(--ink); direction:rtl; font-size:14px; line-height:1.5;
}
button{font-family:inherit; cursor:pointer;}
textarea,input,select{font-family:inherit;}
textarea:focus,select:focus,input[type=search]:focus{
  outline:none;border-color:var(--blue2)!important;box-shadow:0 0 0 3px rgba(15,157,120,.13);
}

/* ── Top app-bar (mirrors the program) ─────────────────────────────────── */
.appbar{
  background:linear-gradient(180deg,#12b088,#0f766e); color:#fff;
  padding:14px 22px; display:flex; align-items:center; gap:14px;
  box-shadow:0 2px 10px rgba(15,80,60,.25); position:sticky; top:0; z-index:50; flex-wrap:wrap;
}
.appbar .logo{
  width:46px;height:46px;border-radius:10px;background:#fff;color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex:none;
}
.appbar h1{font-size:20px;margin:0;font-weight:800;}
.appbar .sub{font-size:12.5px;opacity:.9;}
.appbar .spacer{flex:1;}
.appbar .reporter{
  border:none;border-radius:8px;padding:8px 12px;font-size:13px;width:180px;
  background:rgba(255,255,255,.16);color:#fff;
}
.appbar .reporter::placeholder{color:rgba(255,255,255,.75);}
.appbar .reporter:focus{outline:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.24);}
.saved{font-size:12px;color:#eafff6;font-weight:700;opacity:0;transition:opacity .4s;}
.saved.show{opacity:.95;}

/* ── Statistics strip ──────────────────────────────────────────────────── */
.stats{display:flex;gap:10px;flex-wrap:wrap;padding:14px 22px 4px;}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:8px 16px;min-width:92px;text-align:center;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .12s,box-shadow .12s;
}
.stat:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(15,80,60,.14);}
.stat b{display:block;font-size:22px;font-weight:900;line-height:1.1;}
.stat span{font-size:12px;color:var(--muted);}
.stat.total b{color:var(--blue);}
.stat.bugs  b{color:var(--red);}
.stat.imp   b{color:var(--teal);}
.stat.open  b{color:var(--amber);}
.stat.done  b{color:var(--green);}
.stat.crit  b{color:var(--red);}

/* ── Toolbar ───────────────────────────────────────────────────────────── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 22px 14px;}
.toolbar input[type=search],.toolbar select{
  border:1px solid #cfe2da;border-radius:10px;padding:9px 12px;background:#fff;font-size:14px;
}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:400px;}
.btn{
  border:none;border-radius:10px;padding:9px 18px;font-weight:800;font-size:14px;color:#fff;
  background:linear-gradient(180deg,var(--blue2),var(--blue));box-shadow:var(--shadow);
}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:#fff;color:#1f2937;border:1px solid #cfe2da;}
.btn.teal{background:linear-gradient(180deg,#fbbf24,#f59e0b);}
.btn.small{padding:5px 12px;font-size:12.5px;border-radius:8px;}
.btn.danger{background:linear-gradient(180deg,#f87171,#dc2626);}

/* ── Layout: sidebar (tabs) + content ──────────────────────────────────── */
.layout{display:flex;gap:16px;padding:0 22px 40px;align-items:flex-start;}
.sidebar{
  width:230px;flex:none;position:sticky;top:96px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.sidebar h3{margin:0;padding:12px 16px;font-size:13px;color:var(--muted);
  border-bottom:1px solid var(--line);background:#f2f9f5;font-weight:800;}
.tab-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;
  background:none;border:none;padding:12px 16px;font-size:15px;font-weight:700;color:var(--ink);
  border-bottom:1px solid #eef6f2;transition:background .12s;
}
.tab-btn .ic{font-size:18px;}
.tab-btn .cnt{margin-inline-start:auto;background:var(--blue-soft);color:var(--blue);
  border-radius:20px;padding:1px 9px;font-size:12px;font-weight:800;min-width:22px;text-align:center;}
.tab-btn:hover{background:#f2f9f5;}
.tab-btn.active{background:var(--blue-soft);color:var(--blue);box-shadow:inset 3px 0 0 var(--blue);font-weight:800;}

.content{flex:1;min-width:0;}
.content-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px;flex-wrap:wrap;}
.content-head h2{margin:0;font-size:22px;font-weight:800;}
.content-head .desc{color:var(--muted);font-size:13px;}

/* first-run hero */
.hero{
  background:linear-gradient(135deg,#e6f6f0,#f4feff);border:1px solid var(--line);
  border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);
}
.hero b{font-size:16px;}
.hero p{margin:6px 0 0;color:#33544b;font-size:13.5px;}

/* ── Item cards ────────────────────────────────────────────────────────── */
.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.item-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f2f9f5;
  border-bottom:1px solid var(--line);flex-wrap:wrap;}
.item.slim .item-head{border-bottom:none;background:#fff;padding:9px 16px;}
.item.slim{box-shadow:0 1px 2px rgba(15,80,60,.05);}
.item-head .name{font-weight:800;font-size:15.5px;}
.type-badge{font-size:11.5px;font-weight:800;border-radius:20px;padding:2px 10px;color:#fff;flex:none;}
.type-field{background:#0891b2;} .type-button{background:var(--blue);}
.type-action{background:var(--purple);} .type-table{background:#475569;}
.item-head .idesc{color:var(--muted);font-size:12.5px;}
.item-head .grow{flex:1;}
.item-head .cnt2{background:var(--blue-soft);color:var(--blue);border-radius:20px;
  padding:1px 9px;font-size:12px;font-weight:800;flex:none;}
.item-body{padding:0 12px;}
.item-body .bug:first-child{margin-top:12px;}

/* ── Report cards ──────────────────────────────────────────────────────── */
.bug{border:1px solid #e2ede9;border-radius:10px;padding:12px;margin-bottom:12px;background:#fcfefd;}
.bug.sev-critical{border-inline-start:5px solid var(--red);}
.bug.sev-high{border-inline-start:5px solid #ea580c;}
.bug.sev-medium{border-inline-start:5px solid var(--amber);}
.bug.sev-low{border-inline-start:5px solid #16a34a;}
.bug.kind-improvement{background:var(--teal-soft);border-inline-start:5px solid var(--teal);}
.bug.collapsed{padding:9px 12px;}
.bug-sum{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0;}
.bug-sum .snip{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;}
.bug-sum .meta{color:var(--muted);font-size:12px;flex:none;}
.bug-sum .bug-id{flex:none;}
.bug-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.bug-top select{border:1px solid #cfe2da;border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:700;background:#fff;}
.bug-top select.sel-kind[data-k="improvement"]{color:var(--teal);border-color:#a5e8f2;background:#f4feff;}
.bug-top select.sel-kind[data-k="bug"]{color:var(--red);}
.bug-top .bug-id{color:#94a3b8;font-size:12px;margin-inline-start:auto;}
.fold{background:#fff;border:1px solid #cfe2da;border-radius:8px;width:26px;height:26px;
  font-size:12px;color:var(--muted);padding:0;line-height:1;flex:none;}
.fold:hover{background:var(--blue-soft);color:var(--blue);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fieldbox label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px;}
.fieldbox textarea{
  width:100%;border:1px solid #cfe2da;border-radius:8px;padding:8px;font-size:13.5px;resize:vertical;
  min-height:46px;background:#fff;
}
.fieldbox textarea.desc{min-height:60px;}
.fieldbox{margin-bottom:9px;}
.dropzone{
  border:2px dashed #bcd8cd;border-radius:8px;padding:10px;text-align:center;color:#94a3b8;
  font-size:12.5px;background:#f6fbf9;cursor:pointer;transition:.15s;
}
.dropzone.over{border-color:var(--blue2);background:var(--blue-soft);color:var(--blue);}
.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.shot{position:relative;}
.shot img{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer;}
.shot .del{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--red);color:#fff;border:none;
  border-radius:50%;width:20px;height:20px;font-weight:900;font-size:12px;line-height:1;}
.bug-actions{display:flex;gap:8px;margin-top:8px;}

/* status colour tags in selects */
.sel-status[data-v="fixed"],.sel-status[data-v="verified"]{color:var(--green);}
.sel-status[data-v="in-progress"]{color:var(--purple);}
.sel-status[data-v="new"]{color:var(--amber);}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(15,46,40,.85);display:none;align-items:center;
  justify-content:center;z-index:100;padding:30px;}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}

.empty-note{color:#94a3b8;text-align:center;padding:40px;font-size:15px;}
@media(max-width:820px){
  .layout{flex-direction:column;} .sidebar{width:100%;position:static;}
  .grid2{grid-template-columns:1fr;}
}
.toast{position:fixed;inset-inline-end:20px;bottom:20px;background:#0f2e28;color:#fff;padding:10px 18px;
  border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);
  transition:.2s;z-index:120;font-weight:700;}
.toast.show{opacity:1;transform:none;}
.toast button{background:#12b088;color:#fff;border:none;border-radius:7px;padding:4px 12px;
  font-weight:800;margin-inline-start:10px;font-size:13px;}
.toast button:hover{filter:brightness(1.1);}
</style>
</head>
<body>

<div class="appbar">
  <div class="logo">🐞</div>
  <div>
    <h1>כלי דיווח תקלות ובקשות שיפור</h1>
    <div class="sub" id="subline"></div>
  </div>
  <div class="spacer"></div>
  <span class="saved" id="savedInd">✓ נשמר</span>
  <input class="reporter" id="reporter" placeholder="שם המדווח (לא חובה)"
         oninput="state.reporter=this.value;save()">
  <button class="btn ghost" onclick="copyReport()">📋 העתק ללוח</button>
  <button class="btn" onclick="exportHtmlReport()" title="דוח מעוצב אחד עם כל הדיווחים והתמונות — מוכן לשליחה">⬇ הורד דוח מלא</button>
</div>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="search" id="search" placeholder="🔎 חיפוש: תיאור, שלבים, פריט..." oninput="render()">
  <select id="fKind" onchange="render()">
    <option value="">🐞💡 תקלות ושיפורים</option>
    <option value="bug">🐞 תקלות בלבד</option>
    <option value="improvement">💡 שיפורים בלבד</option>
  </select>
  <select id="fSeverity" onchange="render()">
    <option value="">כל הרמות</option>
    <option value="critical">קריטי / דחוף</option>
    <option value="high">גבוה</option>
    <option value="medium">בינוני</option>
    <option value="low">נמוך</option>
  </select>
  <select id="fStatus" onchange="render()">
    <option value="">כל הסטטוסים</option>
    <option value="open">◌ פתוחים (חדש + בטיפול)</option>
    <option value="new">חדש</option>
    <option value="in-progress">בטיפול</option>
    <option value="closed">● סגורים (טופל + נבדק)</option>
    <option value="fixed">טופל / בוצע</option>
    <option value="verified">נבדק / אושר</option>
  </select>
  <button class="btn ghost small" onclick="exportMdReport()" title="הורדת הדוח כקובץ טקסט (Markdown), בלי תמונות">⬇ דוח טקסט</button>
  <button class="btn ghost small" onclick="exportBackup()" title="שמירת כל הדיווחים (כולל תמונות) לקובץ — להעברה למחשב אחר">💾 שמור גיבוי</button>
  <button class="btn ghost small" onclick="document.getElementById('importFile').click()" title="טעינת קובץ גיבוי — הדיווחים מתמזגים עם הקיימים">📂 ייבוא גיבוי</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden
         onchange="importBackup(this.files[0]);this.value=''">
  <button class="btn ghost small" onclick="clearAll()">🗑 נקה הכל</button>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <h3>לשוניות התוכנה</h3>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lbImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
const APP_VERSION = "3.19";   /* ← מקור אמת יחיד למספר הגרסה בכלי הזה */

/* ======================= מבנה התוכנה (לשוניות ופריטים) =======================
   מעודכן לגרסת APP_VERSION — 5 אזורים בתוכנה (חלוקה · אנשים · הודעות · צינתוקים · הגדרות). כולל:
   ברירת מחדל "כל המקבלים" (קבועים + חד-פעמיים יחד לפי ניקוד),
   שני שלבים (הכנה → רישום מי קיבל / מי לא הגיע), התראות אי-הגעה,
   בחירת חד-פעמיים בחלון, מצב "סינון מותאם" + איזון בין קהילות,
   שמור PDF, סנכרון בין 2 מחשבים, צ'אט צוות ("הודעות"), בקרת מנהל,
   גודל טקסט באחוזים (מיידי), סטטוס סנכרון ויזואלי, הודעות למפתח בתוך התוכנה,
   וצינתוקים — הודעה קולית לזכאי החלוקה דרך ימות המשיח (2.82; מ-2.85 אישור הגעה בהקשה על 7; מ-2.86 יצירת הקלטה מטקסט בקול AI + מאגר הקלטות).
   * לשונית "חד פעמי" הנפרדת הוסרה — הבחירה נעשית מתוך מסך החלוקה. */
const APP_STRUCTURE = [
  { key:"dist", name:"חלוקה ורישום", icon:"📋", items:[
    {key:"name",     name:"שדה: שם החלוקה", type:"field",  desc:"בשבועי רגיל אפשר להשאיר ריק — מ-2.93 נכתב אוטומטית עם הפרשה והתאריך העברי, למשל 'חלוקת פרשת נצבים — כ׳ אלול תשפ״ו'; חובה במצב מיוחד"},
    {key:"date",     name:"שדה: תאריך",     type:"field",  desc:"לוח שנה, ימי רביעי מסומנים"},
    {key:"distr",    name:"שדה: מחלק",      type:"field",  desc:"שם מבצע החלוקה; נזכר אוטומטית"},
    {key:"prod",     name:"שדה: מוצרים זמינים", type:"field", desc:"מספר המנות; קובע כמה נשאר לחד-פעמיים"},
    {key:"reserve",  name:"שדה: רזרבה",     type:"field",  desc:"כמה אנשי רזרבה לצרף (רשימת המתנה)"},
    {key:"note",     name:"שדה: הערה כללית לחלוקה", type:"field", desc:"נשמרת פעם אחת ברמת החלוקה"},
    {key:"leftover", name:"חיווי: נשאר לחד-פעמיים", type:"action", desc:"מציג כמה מנות נותרו ואם נבחרו חד-פעמיים"},
    {key:"pickone",  name:"כפתור: בחר חד-פעמיים", type:"button", desc:"פותח חלון בחירה — מומלצים מסומנים מראש; מוסיף אותם לחלוקה"},
    {key:"manualadd",name:"כפתור: ＋ הוסף מקבל (ידני)", type:"button", desc:"הוספת כל מקבל פעיל לחלוקה — גם אם אינו בתור השבוע"},
    {key:"qsearch",  name:"שדה: חיפוש מהיר ברשימה", type:"field", desc:"סינון רשימת השבוע לפי כל פרט"},

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  return d.toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"})
       + " " + d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
}

/* ============================== מצב + אחסון ============================== */
const LS_KEY = "manhal_bug_reports_v1";
let state = { bugs:{}, activeTab: APP_STRUCTURE[0].key, reporter:"" };
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const p = JSON.parse(raw);
      state.bugs = p.bugs||{}; state.activeTab = p.activeTab||state.activeTab;
      state.reporter = p.reporter||"";
    }
  }catch(e){ console.warn("load failed", e); }
  // migrate old records that predate newer fields
  for(const k in state.bugs) for(const b of state.bugs[k]){
    if(!b.kind) b.kind = "bug";
    if(!b.shots) b.shots = [];
  }
  // if the saved active tab no longer exists (e.g. removed "חד פעמי"), fall back
  if(!APP_STRUCTURE.some(t=>t.key===state.activeTab)) state.activeTab = APP_STRUCTURE[0].key;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      const ind=document.getElementById("savedInd");
      ind.classList.add("show");
      clearTimeout(ind._t); ind._t=setTimeout(()=>ind.classList.remove("show"),1500);
    }
    catch(e){ toast("⚠ שמירה נכשלה — אולי אין מקום. שמור גיבוי (💾) ומחק דיווחים ישנים"); }
  }, 250);
}
function itemKey(tab,item){ return tab+"::"+item; }
function bugsFor(tab,item){ return state.bugs[itemKey(tab,item)] || []; }
function findBug(tab,item,id){ return (state.bugs[itemKey(tab,item)]||[]).find(b=>b.id===id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================== פעולות דיווח ============================== */
function newReport(tab,item,kind){
  kind = kind==="improvement" ? "improvement" : "bug";
  const k = itemKey(tab,item);
  const id = uid();
  (state.bugs[k] = state.bugs[k]||[]).push({
    id, kind, severity:"medium", status:"new",
    desc:"", steps:"", actual:"", expected:"", notes:"", shots:[],
    created:new Date().toISOString(), ver:APP_VERSION
  });
  save(); render();
  const el = document.querySelector(`.bug[data-id="${id}"]`);
  if(el){
    const ta = el.querySelector("textarea.desc");
    if(ta) ta.focus({preventScroll:true});
    el.scrollIntoView({behavior:"smooth", block:"center"});
    lastBugRef = {tab, item, id};
  }
}
let lastDeleted=null;
function delBug(tab,item,id){
  const k = itemKey(tab,item);
  const arr = state.bugs[k]||[];
  const idx = arr.findIndex(b=>b.id===id);
  if(idx<0) return;
  lastDeleted = {k, bug:arr[idx], idx};
  arr.splice(idx,1);
  if(!arr.length) delete state.bugs[k];
  save(); render();
  toast("הדיווח נמחק", "בטל", undoDelete);
}
function undoDelete(){
  if(!lastDeleted) return;
  const arr = state.bugs[lastDeleted.k] = state.bugs[lastDeleted.k]||[];
  arr.splice(Math.min(lastDeleted.idx, arr.length), 0, lastDeleted.bug);
  lastDeleted=null;
  save(); render();
}
function dupBug(tab,item,id){
  const k = itemKey(tab,item);
  const src = findBug(tab,item,id);
  if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid(); copy.created = new Date().toISOString();
  delete copy.updated; copy.ver = APP_VERSION;
  const idx = state.bugs[k].findIndex(b=>b.id===id);
  state.bugs[k].splice(idx+1,0,copy);
  save(); render();
}
function updBug(tab,item,id,field,val){
  const b = findBug(tab,item,id);
  if(!b) return;
  b[field]=val; b.updated=new Date().toISOString();
  save();
  if(field==="severity"||field==="status"||field==="kind") render(); else updateStats();
}
function toggleBug(tab,item,id){
  const b = findBug(tab,item,id);
  if(b){ b.collapsed = !b.collapsed; save(); render(); }
}

/* ============================== צילומי מסך ============================== */
const MAX_IMG_DIM = 1600;          // תמונות גדולות מוקטנות כדי לא למלא את LocalStorage
function fileToShot(f, cb){
  const r = new FileReader();
  r.onload = e=>{
    const raw = e.target.result;
    const img = new Image();
    img.onload = ()=>{
      const big = Math.max(img.width, img.height);
      if(big<=MAX_IMG_DIM && raw.length<=500000){ cb({name:f.name||"צילום מהלוח", data:raw}); return; }
      let w=img.width, h=img.height;
      if(big>MAX_IMG_DIM){ const s=MAX_IMG_DIM/big; w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      let out;
      try{
        const png=c.toDataURL("image/png"), jpg=c.toDataURL("image/jpeg",.85);
        out = jpg.length<png.length ? jpg : png;
      }catch(_){ out = raw; }
      cb({name:f.name||"צילום מהלוח", data:out});
    };
    img.onerror = ()=>cb({name:f.name||"תמונה", data:raw});
    img.src = raw;
  };
  r.readAsDataURL(f);
}
function addShots(tab,item,id,files){
  const b = findBug(tab,item,id);
  if(!b) return;
  const imgs = [...files].filter(f=>f.type && f.type.startsWith("image/"));
  if(!imgs.length) return;
  let pending = imgs.length;
  imgs.forEach(f=>fileToShot(f, shot=>{
    b.shots.push(shot);
    if(--pending===0){
      b.updated=new Date().toISOString(); save(); render();
      toast(imgs.length===1 ? "📎 התמונה צורפה" : `📎 צורפו ${imgs.length} תמונות`);
    }
  }));
}
function delShot(tab,item,id,idx){
  const b = findBug(tab,item,id);
  if(b){ b.shots.splice(idx,1); b.updated=new Date().toISOString(); save(); render(); }
}
function lightbox(src){ const lb=document.getElementById("lightbox"); document.getElementById("lbImg").src=src; lb.classList.add("show"); }

/* הדבקת צילום מסך (Ctrl+V) לתוך הדיווח האחרון שנלחץ */
let lastBugRef=null;
function refFromEl(el){
  const card = el && el.closest ? el.closest(".bug") : null;
  if(card && card.dataset.id) lastBugRef = {tab:card.dataset.tab, item:card.dataset.item, id:card.dataset.id};
}
document.addEventListener("focusin", e=>refFromEl(e.target));
document.addEventListener("click",   e=>refFromEl(e.target));
document.addEventListener("paste", e=>{
  const items = [...((e.clipboardData&&e.clipboardData.items)||[])].filter(i=>i.type&&i.type.startsWith("image/"));
  if(!items.length) return;
  const files = items.map(i=>i.getAsFile()).filter(Boolean);
  if(!files.length) return;
  const b = lastBugRef && findBug(lastBugRef.tab,lastBugRef.item,lastBugRef.id);
  if(!b){ toast("כדי להדביק צילום — לחץ קודם בתוך דיווח, ואז Ctrl+V"); return; }
  e.preventDefault();
  addShots(lastBugRef.tab, lastBugRef.item, lastBugRef.id, files);
});

/* ============================== סינון ============================== */
function activeFilters(){
  return {
    q: document.getElementById("search").value.trim().toLowerCase(),
    kind: document.getElementById("fKind").value,
    sev: document.getElementById("fSeverity").value,
    st: document.getElementById("fStatus").value,
  };
}
function bugMatches(b,item,f){
  if(f.kind && kindOf(b)!==f.kind) return false;
  if(f.sev && b.severity!==f.sev) return false;
  if(f.st){
    const open = (b.status==="new" || b.status==="in-progress");
    if(f.st==="open"){ if(!open) return false; }
    else if(f.st==="closed"){ if(open) return false; }
    else if(b.status!==f.st) return false;
  }
  if(f.q){
    const hay = [b.desc,b.steps,b.actual,b.expected,b.notes,item.name,b.id].join(" ").toLowerCase();
    if(!hay.includes(f.q)) return false;
  }
  return true;
}
function filtering(f){ return !!(f.q||f.kind||f.sev||f.st); }
function setFilters(o){
  o = o||{};
  document.getElementById("search").value = o.q||"";
  document.getElementById("fKind").value = o.kind||"";
  document.getElementById("fSeverity").value = o.sev||"";
  document.getElementById("fStatus").value = o.st||"";
  render();
}

/* ============================== רינדור ============================== */
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function countAll(){
  let c={total:0,bug:0,improvement:0,new:0,"in-progress":0,fixed:0,verified:0,critical:0};
  for(const k in state.bugs) for(const b of state.bugs[k]){
    c.total++; c[kindOf(b)]++; c[b.status]=(c[b.status]||0)+1;
    if(kindOf(b)==="bug" && b.severity==="critical") c.critical++;
  }
  return c;
}
function updateStats(){
  const c = countAll();
  document.getElementById("stats").innerHTML = `
    <div class="stat total" title="הצג הכל (ניקוי סינון)" onclick="setFilters()"><b>${c.total}</b><span>סה״כ דיווחים</span></div>
    <div class="stat bugs" title="לחץ לסינון תקלות" onclick="setFilters({kind:'bug'})"><b>${c.bug}</b><span>🐞 תקלות</span></div>
    <div class="stat imp" title="לחץ לסינון שיפורים" onclick="setFilters({kind:'improvement'})"><b>${c.improvement}</b><span>💡 שיפורים</span></div>
    <div class="stat open" title="לחץ לסינון הפתוחים" onclick="setFilters({st:'open'})"><b>${(c.new||0)+(c["in-progress"]||0)}</b><span>פתוחים</span></div>
    <div class="stat done" title="לחץ לסינון מה שטופל" onclick="setFilters({st:'closed'})"><b>${(c.fixed||0)+(c.verified||0)}</b><span>טופלו</span></div>
    <div class="stat crit" title="לחץ לסינון תקלות קריטיות" onclick="setFilters({kind:'bug',sev:'critical'})"><b>${c.critical||0}</b><span>תקלות קריטיות</span></div>`;
}

function renderSidebar(){
  const f = activeFilters();
  let html = "<h3>לשוניות התוכנה</h3>";
  APP_STRUCTURE.forEach(tab=>{
    let cnt=0; tab.items.forEach(it=>{ cnt += bugsFor(tab.key,it.key).filter(b=>bugMatches(b,it,f)).length; });
    html += `<button class="tab-btn ${tab.key===state.activeTab?'active':''}" onclick="selectTab('${tab.key}')">
      <span class="ic">${tab.icon}</span><span>${tab.name}</span>
      ${cnt?`<span class="cnt">${cnt}</span>`:""}</button>`;
  });
  document.getElementById("sidebar").innerHTML = html;
}

function bugCard(tab,item,b){
  const kind = kindOf(b);
  const U = `'${tab}','${item.key}','${b.id}'`;
  const dataAttrs = `data-tab="${tab}" data-item="${item.key}" data-id="${b.id}"`;
  if(b.collapsed){
    const snip = (b.desc||"").split("\n")[0].trim().slice(0,90) || "(ללא תיאור)";
    return `<div class="bug kind-${kind} sev-${b.severity} collapsed" ${dataAttrs}>
      <div class="bug-sum" onclick="toggleBug(${U})" title="לחץ להרחבה">
        <span>${KINDS[kind].icon}</span>
        <span class="snip">${esc(snip)}</span>
        <span class="meta">${SEVERITIES[b.severity]} · ${statusText(kind,b.status)}${b.shots.length?` · 📎${b.shots.length}`:""}</span>
        <span class="bug-id"><bdi dir="ltr">#${b.id.slice(-5)}</bdi></span>
      </div></div>`;
  }
  const L = FIELD_LABELS[kind];
  const shots = b.shots.map((s,i)=>`
    <div class="shot"><img src="${s.data}" title="${esc(s.name)}" onclick="lightbox(this.src)">
      <button class="del" title="מחק תמונה" onclick="delShot(${U},${i})">×</button></div>`).join("");
  const kindOpts = Object.entries(KINDS).map(([v,o])=>`<option value="${v}" ${kind===v?"selected":""}>${o.icon} ${o.label}</option>`).join("");
  const sevOpts  = Object.entries(SEVERITIES).map(([v,t])=>`<option value="${v}" ${b.severity===v?"selected":""}>${t}</option>`).join("");
  const stOpts   = Object.keys(STATUS_TEXT[kind]).map(v=>`<option value="${v}" ${b.status===v?"selected":""}>${statusText(kind,v)}</option>`).join("");
  return `<div class="bug kind-${kind} sev-${b.severity}" ${dataAttrs}>
    <div class="bug-top">
      <button class="fold" title="כווץ את הדיווח" onclick="toggleBug(${U})">▾</button>
      <select class="sel-kind" data-k="${kind}" title="סוג הדיווח" onchange="updBug(${U},'kind',this.value)">${kindOpts}</select>
      <select title="${SEV_TITLE[kind]}" onchange="updBug(${U},'severity',this.value)">${sevOpts}</select>
      <select class="sel-status" data-v="${b.status}" title="סטטוס" onchange="updBug(${U},'status',this.value)">${stOpts}</select>
      <span class="bug-id">${b.created?fmtDate(b.created)+" · ":""}<bdi dir="ltr">#${b.id.slice(-5)}</bdi></span>
    </div>
    <div class="fieldbox"><label>${L.desc}</label>
      <textarea class="desc" oninput="updBug(${U},'desc',this.value)" placeholder="${esc(L.descPh)}">${esc(b.desc)}</textarea></div>
    <div class="fieldbox"><label>${L.steps}</label>
      <textarea oninput="updBug(${U},'steps',this.value)" placeholder="${esc(L.stepsPh)}">${esc(b.steps)}</textarea></div>
    <div class="grid2">
      <div class="fieldbox"><label>${L.actual}</label>
        <textarea oninput="updBug(${U},'actual',this.value)" placeholder="${esc(L.actualPh)}">${esc(b.actual)}</textarea></div>
      <div class="fieldbox"><label>${L.expected}</label>
        <textarea oninput="updBug(${U},'expected',this.value)" placeholder="${esc(L.expectedPh)}">${esc(b.expected)}</textarea></div>
    </div>
    <div class="fieldbox"><label>${L.notes}</label>
      <textarea oninput="updBug(${U},'notes',this.value)">${esc(b.notes)}</textarea></div>
    <div class="dropzone" ondragover="event.preventDefault();this.classList.add('over')"
         ondragleave="this.classList.remove('over')"
         ondrop="event.preventDefault();this.classList.remove('over');addShots(${U},event.dataTransfer.files)"
         onclick="if(event.target.tagName!=='INPUT')this.querySelector('input').click()">
      📎 גרור לכאן תמונות מסך, הדבק (Ctrl+V) או לחץ לבחירה
      <input type="file" accept="image/*" multiple hidden onchange="addShots(${U},this.files)">
    </div>
    ${shots?`<div class="shots">${shots}</div>`:""}
    <div class="bug-actions">
      <button class="btn ghost small" onclick="dupBug(${U})">⧉ שכפל</button>
      <button class="btn danger small" onclick="delBug(${U})">🗑 מחק</button>
    </div>
  </div>`;
}

function renderContent(){
  const tab = APP_STRUCTURE.find(t=>t.key===state.activeTab);
  const f = activeFilters();
  const filt = filtering(f);
  const c = countAll();
  let html = `<div class="content-head"><h2>${tab.icon} ${tab.name}</h2>
     <span class="desc">${filt?"מוצגים דיווחים מסוננים בלבד":"לחץ ＋ תקלה או ＋ שיפור ליד הפריט המתאים · צילומי מסך אפשר גם להדביק (Ctrl+V)"}</span></div>`;
  if(!c.total && !filt){
    html += `<div class="hero"><b>👋 ברוכים הבאים לכלי הדיווח</b>
      <p>מצאתם תקלה בתוכנה או שיש רעיון לשיפור? בחרו ברשימה מימין את הלשונית המתאימה, אתרו את הפריט ולחצו <b>＋ תקלה</b> או <b>＋ שיפור</b>. הכל נשמר אוטומטית במחשב הזה.</p>
      <p>אפשר לצרף צילומי מסך בגרירה, בבחירה או בהדבקה (Ctrl+V). בסיום — <b>⬇ הורד דוח מלא</b> למעלה, ושלחו את הקובץ למפתח.</p></div>`;
  }
  let shownItems = 0;
  tab.items.forEach(item=>{
    let bugs = bugsFor(tab.key,item.key);
    if(filt){ bugs = bugs.filter(b=>bugMatches(b,item,f)); if(!bugs.length) return; }
    shownItems++;
    const slim = !bugs.length;
    html += `<div class="item${slim?' slim':''}">
      <div class="item-head">
        <span class="type-badge type-${item.type}">${({field:"שדה",button:"כפתור",action:"פעולה",table:"טבלה"})[item.type]}</span>
        <span class="name">${item.name}</span>
        ${bugs.length?`<span class="cnt2">${bugs.length}</span>`:""}
        <span class="grow"></span>
        <span class="idesc">${esc(item.desc||"")}</span>
        <button class="btn small" onclick="newReport('${tab.key}','${item.key}','bug')">＋ תקלה</button>
        <button class="btn teal small" onclick="newReport('${tab.key}','${item.key}','improvement')">＋ שיפור</button>
      </div>
      ${bugs.length?`<div class="item-body">${bugs.map(b=>bugCard(tab.key,item,b)).join("")}</div>`:""}
    </div>`;
  });
  if(filt && !shownItems) html += `<div class="empty-note">אין דיווחים שתואמים את הסינון בלשונית זו.</div>`;
  document.getElementById("content").innerHTML = html;
}

function render(){ updateStats(); renderSidebar(); renderContent(); }
function selectTab(k){ state.activeTab=k; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ============================== ייצוא / העתקה ============================== */
function reportMeta(){
  return `נוצר: ${new Date().toLocaleString("he-IL")}`
       + (state.reporter?` · מדווח: ${state.reporter}`:"")
       + ` · מנהל חלוקה גרסה ${APP_VERSION}`;
}
function buildReport(){
  const c = countAll();
  let md = `# דוח תקלות ובקשות שיפור — מנהל חלוקה (גרסה ${APP_VERSION})\n\n`;
  md += reportMeta()+`\n\n`;
  md += `**סיכום:** סה״כ ${c.total} · 🐞 תקלות ${c.bug} · 💡 שיפורים ${c.improvement} · `;
  md += `פתוחים ${(c.new||0)+(c["in-progress"]||0)} · טופלו ${(c.fixed||0)+(c.verified||0)} · תקלות קריטיות ${c.critical||0}\n`;
  let any=false;
  APP_STRUCTURE.forEach(tab=>{
    const itemsWithBugs = tab.items.filter(it=>bugsFor(tab.key,it.key).length);
    if(!itemsWithBugs.length) return;
    md += `\n## לשונית: ${tab.name}\n`;
    itemsWithBugs.forEach(it=>{
      md += `\n### ${it.name}\n`;
      bugsFor(tab.key,it.key).forEach((b,i)=>{
        any=true;
        const kind = kindOf(b);
        const K = KINDS[kind];
        md += `\n**${K.icon} ${K.label} ${i+1}** (#${b.id.slice(-5)}) — ${SEV_TITLE[kind]}: ${SEVERITIES[b.severity]} · סטטוס: ${statusText(kind,b.status)}`;
        if(b.created) md += ` · דווח ב-${fmtDate(b.created)}`;
        if(b.ver && b.ver!==APP_VERSION) md += ` (בגרסה ${b.ver})`;
        md += `\n`;
        const L = FIELD_LABELS[kind];
        if(b.desc)     md += `- ${L.desc}: ${b.desc.replace(/\n/g," ")}\n`;
        if(b.steps)    md += `- ${L.steps}: ${b.steps.replace(/\n/g," / ")}\n`;
        if(b.actual)   md += `- ${L.actual}: ${b.actual.replace(/\n/g," ")}\n`;
        if(b.expected) md += `- ${L.expected}: ${b.expected.replace(/\n/g," ")}\n`;
        if(b.notes)    md += `- ${L.notes}: ${b.notes.replace(/\n/g," ")}\n`;
        if(b.shots.length) md += `- צורפו ${b.shots.length} תמונות מסך: ${b.shots.map(s=>s.name).join(", ")}\n`;
      });
    });
  });
  if(!any) md += `\n_לא נרשמו דיווחים._\n`;
  return md;
}

/* דוח HTML מלא — כולל התמונות, מוכן לשליחה למפתח */

    withB.forEach(it=>{
      secs += `<h3>${esc(it.name)}</h3>`;
      bugsFor(tab.key,it.key).forEach(b=>{
        any=true;
        const kind = kindOf(b), K = KINDS[kind], L = FIELD_LABELS[kind];
        const border = kind==="improvement" ? "#0891b2" : (SEVC[b.severity]||"#b45309");
        const bg = kind==="improvement" ? "#ecfeff" : "#fcfefd";

        ["desc","steps","actual","expected","notes"].forEach(fk=>{

        });
        const shots = b.shots.length
          ? `<div class="shots">${b.shots.map(s=>`<figure><img src="${s.data}" alt=""><figcaption>${esc(s.name)}</figcaption></figure>`).join("")}</div>`

        secs += `<div class="report" style="border-inline-start-color:${border};background:${bg}">
          <div class="rt">${K.icon} <b>${K.label}</b> · ${SEV_TITLE[kind]}: ${SEVERITIES[b.severity]} · סטטוס: ${statusText(kind,b.status)}
            <span class="rid">${b.created?fmtDate(b.created)+" · ":""}${b.ver?"גרסה "+b.ver+" · ":""}<bdi dir="ltr">#${b.id.slice(-5)}</bdi></span></div>
          ${rows}${shots}</div>`;

  if(!any) secs = `<p>לא נרשמו דיווחים.</p>`;
  return `<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8">

function download(name,text,mime){
  const blob = new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function exportHtmlReport(){
  download(`דוח_תקלות_מנהל_חלוקה_${stamp()}.html`, buildHtmlReport(), "text/html");
  toast("⬇ הדוח המלא ירד — שלחו את הקובץ למפתח");
}
function exportMdReport(){
  download(`דוח_תקלות_ושיפורים_${stamp()}.md`, buildReport(), "text/markdown");
  toast("📄 דוח הטקסט ירד");
}
async function copyReport(){
  const txt = buildReport();
  try{ await navigator.clipboard.writeText(txt); toast("📋 הדוח הועתק ללוח"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy"); toast("📋 הדוח הועתק ללוח");}catch(_){toast("⚠ ההעתקה נכשלה");}
    ta.remove();
  }
}

function exportBackup(){
  download(`גיבוי_דיווחים_מנהל_חלוקה_${stamp()}.json`,
    JSON.stringify({app:"manhal-bug-reports", format:1, exported:new Date().toISOString(),
                    reporter:state.reporter||"", bugs:state.bugs}),
    "application/json");
  toast("💾 קובץ הגיבוי ירד — אפשר להעבירו למחשב אחר ולייבא שם");
}
function importBackup(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      const src = data && data.bugs && typeof data.bugs==="object" ? data.bugs : null;
      if(!src) throw new Error("bad format");
      let added=0, upd=0, skipped=0;
      for(const k in src){
        if(!Array.isArray(src[k])) continue;
        if(!VALID_KEYS.has(k)){ skipped += src[k].length; continue; }
        const arr = state.bugs[k] = state.bugs[k]||[];
        for(const nb of src[k]){
          if(!nb || !nb.id) continue;
          if(!nb.kind) nb.kind="bug";
          if(!nb.shots) nb.shots=[];
          const ex = arr.find(x=>x.id===nb.id);
          if(!ex){ arr.push(nb); added++; }
          else{
            const a=Date.parse(ex.updated||ex.created)||0, bts=Date.parse(nb.updated||nb.created)||0;
            if(bts>a){ Object.assign(ex,nb); upd++; }
          }
        }
        if(!arr.length) delete state.bugs[k];
      }
      save(); render();
      toast(`📂 ייבוא הושלם: נוספו ${added}, עודכנו ${upd}`+(skipped?`, דולגו ${skipped} (פריטים שאינם קיימים)`:""));
    }catch(_){ toast("⚠ הקובץ אינו קובץ גיבוי תקין של הכלי"); }
  };
  r.readAsText(file);
}

function clearAll(){
  if(!confirm("לנקות את כל הדיווחים שנרשמו?\nמומלץ לשמור קודם גיבוי (💾 שמור גיבוי).")) return;
  const backup = state.bugs;
  state.bugs = {}; save(); render();
  toast("נוקו כל הדיווחים", "בטל", ()=>{ state.bugs = backup; save(); render(); });
}

function toast(msg, btnLabel, fn){
  const t=document.getElementById("toast");
  t.innerHTML = esc(msg) + (btnLabel?` <button onclick="toastAct()">${esc(btnLabel)}</button>`:"");
  toast._fn = fn||null;
  t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"), btnLabel?6000:2200);
}
function toastAct(){
  const t=document.getElementById("toast");
  t.classList.remove("show");
  if(toast._fn){ const fn=toast._fn; toast._fn=null; fn(); }
}

/* ============================== אתחול ============================== */
document.getElementById("subline").textContent =
  `מנהל חלוקה · גרסה ${APP_VERSION} · קופה של צדקה הר יונה · נוף הגליל`;
load();
document.getElementById("reporter").value = state.reporter||"";
render();
</script>
